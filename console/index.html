<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent-workflows 操作台</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --fg: #e6e9ef; --muted: #8b93a7; --accent: #5b8def;
    --ok: #35c07a; --warn: #e0a33e; --err: #e05c5c; --wait: #b06bd8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.5 -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line);
                  padding: 2px 8px; border-radius: 999px; }
  .layout { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 45px); }
  aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  main { overflow-y: auto; padding: 16px; }
  .newrun { padding: 12px; border-bottom: 1px solid var(--line); }
  .newrun textarea, .newrun input { width: 100%; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; margin-bottom: 6px; }
  .newrun textarea { resize: vertical; min-height: 56px; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel2); color: var(--fg);
           border-radius: 6px; padding: 6px 12px; font: inherit; }
  button:hover { border-color: #3d475a; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.ok { background: #1d6f47; border-color: #2a8f5e; color: #dcf6e8; }
  button.warn { background: #6d5119; border-color: #8a6a24; color: #f6ecd7; }
  button.err { background: #6d2626; border-color: #8f3232; color: #f8dede; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .run { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .run:hover { background: var(--panel2); }
  .run.active { background: #222838; box-shadow: inset 2px 0 0 var(--accent); }
  .run .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run .m { color: var(--muted); font-size: 11px; margin-top: 3px; display: flex; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .s-waiting { background: var(--wait); } .s-running { background: var(--warn); animation: pulse 1.2s infinite; }
  .s-done { background: var(--ok); } .s-error { background: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
          padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
             margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  pre { background: #0b0d11; border: 1px solid var(--line); border-radius: 6px; padding: 10px;
        overflow: auto; max-height: 380px; margin: 8px 0 0; font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; }
  .diff .add { color: #7fdca4; } .diff .del { color: #f08e8e; } .diff .hunk { color: #7aa2f7; }
  .events { display: flex; flex-wrap: wrap; gap: 6px; }
  .ev { font: 11px ui-monospace, Menlo, monospace; background: var(--panel2); border: 1px solid var(--line);
        border-radius: 999px; padding: 2px 9px; color: var(--muted); }
  .ev.gate { color: #d9b3f0; border-color: #4a3560; }
  .ev.fail { color: #f0a0a0; border-color: #5c2f2f; }
  .ev.pass { color: #9fe0bd; border-color: #2c5c45; }
  textarea.fb { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
                border-radius: 6px; padding: 8px; font: inherit; min-height: 48px; margin-top: 8px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: 12px; }
  .kv .k { color: var(--muted); }
  .result { border-left: 3px solid var(--ok); padding-left: 10px; }
</style>
</head>
<body>
<header>
  <h1>agent-workflows 操作台</h1>
  <span class="badge" id="agentBadge">agent: …</span>
  <span class="badge" id="clock"></span>
</header>

<div id="banner" style="display:none;padding:8px 16px;background:#4a1f1f;color:#f8dede;border-bottom:1px solid #7a3030;font-size:12px"></div>
<div class="layout">
  <aside>
    <div class="newrun">
      <textarea id="task" placeholder="任务描述，例如：给 verify_graph.py 加 --verbose 参数"></textarea>
      <input id="repo" placeholder="repo 路径（服务器上，默认 /opt/agent-workflows/demo-repo）" />
      <input id="testcmd" placeholder="测试命令（在 repo 里执行，退出码 0 = 通过；可留空）" />
      <button class="primary" style="width:100%" onclick="startRun()">启动工作流</button>
    </div>
    <div id="runs"></div>
  </aside>

  <main id="detail"><div class="empty">选择左侧的运行，或新建一个</div></main>
</div>

<script>
let selected = null;
let lastInterruptKey = null;

const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function badge(status) {
  const map = { waiting: ["s-waiting", "待审批"], running: ["s-running", "执行中"],
                done: ["s-done", "已完成"], error: ["s-error", "出错"],
                interrupted: ["s-error", "已中断"] };
  const [cls, label] = map[status] || ["s-running", status];
  return `<span class="dot ${cls}"></span>${label}`;
}

function renderDiff(text) {
  const lines = String(text || "").split("\n");
  return lines.map(l => {
    let cls = "";
    if (l.startsWith("+++") || l.startsWith("---")) cls = "hunk";
    else if (l.startsWith("+")) cls = "add";
    else if (l.startsWith("-")) cls = "del";
    else if (l.startsWith("@@")) cls = "hunk";
    return cls ? `<span class="${cls}">${esc(l)}</span>` : esc(l);
  }).join("\n");
}

async function api(url, opts) {
  const r = await fetch(url, opts);
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(typeof body === "string" ? body : (body.error || JSON.stringify(body)));
  return body;
}

function banner(msg) {
  const el = $("banner");
  if (!msg) { el.style.display = "none"; el.textContent = ""; return; }
  el.style.display = "block";
  el.textContent = msg;
}

async function startRun() {
  banner("");
  const task = $("task").value.trim();
  if (!task) { banner("请先填写任务描述"); return; }
  const payload = { task, max_attempts: 2 };
  const repo = $("repo").value.trim();
  const testcmd = $("testcmd").value.trim();
  if (repo) payload.repo = repo;
  if (testcmd) payload.test_cmd = testcmd;
  try {
    const r = await api("/api/runs", { method: "POST", headers: { "content-type": "application/json" },
                                       body: JSON.stringify(payload) });
    selected = r.thread_id;
    lastInterruptKey = null;
    $("task").value = "";
    if ((r.warnings || []).length) banner("⚠ " + r.warnings.join("；"));
    await refresh();
  } catch (e) { banner("启动失败: " + e.message); }
}

async function resume(action) {
  if (!selected) return;
  const fb = ($("feedback") ? $("feedback").value : "").trim();
  try {
    await api(`/api/runs/${selected}/resume`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ action, feedback: fb }),
    });
    lastInterruptKey = null;
    await refresh();
  } catch (e) { banner("操作失败: " + e.message); }
}

function renderList(runs) {
  const el = $("runs");
  if (!runs.length) { el.innerHTML = `<div class="empty">还没有运行</div>`; return; }
  el.innerHTML = runs.map(r => {
    const v = r.values || {};
    const st = r.error ? "error" : r.status;
    return `<div class="run ${r.thread_id === selected ? "active" : ""}" onclick="selectRun('${r.thread_id}')">
      <div class="t">${badge(st)} ${esc(v.task || r.thread_id)}</div>
      <div class="m"><span>${esc(r.thread_id)}</span>
        <span>${r.status === "waiting" ? "等待人工审批" : (v.result ? "已结束" : "进行中")}</span></div>
    </div>`;
  }).join("");
}

function selectRun(tid) { selected = tid; lastInterruptKey = null; refresh(); }

function renderDetail(run) {
  if (!run || run.status === "unknown") {
    $("detail").innerHTML = `<div class="empty">选择左侧的运行</div>`; return;
  }
  const v = run.values || {};
  const parts = [];

  parts.push(`<div class="card"><div class="row" style="justify-content:space-between">
      <div><h2 style="margin:0 0 4px">${esc(v.task || "-")}</h2>
      <div class="muted">${esc(run.thread_id)} · agent=${esc(run.source || "?")}</div></div>
      <div>${badge(run.status)}</div></div>
      <div class="kv" style="margin-top:10px">
        <div class="k">repo</div><div>${esc(v.repo || "-")}</div>
        <div class="k">尝试次数</div><div>${esc(v.attempt ?? 0)} / ${esc(v.max_attempts ?? 2)}</div>
      </div></div>`);

  // 待审
  for (const itr of (run.interrupts || [])) {
    const stage = itr.stage || "gate";
    parts.push(`<div class="card" style="border-color:#4a3560">
      <h2>待人工决策 · ${esc(stage)}</h2>`);
    if (itr.task) parts.push(`<div class="muted">任务：${esc(itr.task)}</div>`);
    if (itr.plan) parts.push(`<pre>${esc(itr.plan)}</pre>`);
    if (itr.patch) parts.push(`<div class="muted" style="margin-top:10px">改动 diff</div>
      <pre class="diff">${renderDiff(itr.patch)}</pre>`);
    if (itr.test_output) parts.push(`<div class="muted" style="margin-top:10px">测试输出</div>
      <pre>${esc(itr.test_output)}</pre>`);
    if (itr.review) parts.push(`<div class="muted" style="margin-top:10px">review</div>
      <pre>${esc(itr.review)}</pre>`);
    parts.push(`<textarea class="fb" id="feedback" placeholder="revise 时可填反馈（approve/abort 可留空）"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="ok" onclick="resume('approve')">通过 approve</button>
        <button class="warn" onclick="resume('revise')">打回 revise</button>
        <button class="err" onclick="resume('abort')">中止 abort</button>
      </div></div>`);
  }

  // 事件
  if ((v.events || []).length) {
    parts.push(`<div class="card"><h2>事件</h2><div class="events">` +
      v.events.map(e => {
        let cls = "ev";
        if (String(e).includes("gate")) cls += " gate";
        if (String(e).includes("fail")) cls += " fail";
        if (String(e).includes("pass") || String(e).includes(":ok")) cls += " pass";
        return `<span class="${cls}">${esc(e)}</span>`;
      }).join("") + `</div></div>`);
  }

  // 结果 / 错误
  if (v.result) parts.push(`<div class="card"><h2>结果</h2><div class="result">${esc(v.result)}</div></div>`);
  if (run.error) parts.push(`<div class="card" style="border-color:#5c2f2f"><h2>错误</h2>
    <pre>${esc(run.error)}</pre></div>`);

  if (v.patch && !(run.interrupts || []).some(i => i.patch)) {
    parts.push(`<div class="card"><h2>最近 diff</h2><pre class="diff">${renderDiff(v.patch)}</pre></div>`);
  }

  $("detail").innerHTML = parts.join("");
}

async function refresh() {
  try {
    const [health, list] = await Promise.all([api("/api/health"), api("/api/runs")]);
    $("agentBadge").textContent = "agent: " + health.agent;
    renderList(list.runs || []);
    if (selected) {
      const run = await api("/api/runs/" + selected);
      renderDetail(run);
    }
  } catch (e) {
    console.error(e);
  }
  $("clock").textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
}

refresh();
setInterval(refresh, 2500);
</script>
</body>
</html>
